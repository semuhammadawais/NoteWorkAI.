name: NoteworkAI CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install client dependencies
        working-directory: notework-client
        run: npm ci

      - name: Build client
        working-directory: notework-client
        run: npm run build

      - name: Install server dependencies
        working-directory: notework-server
        run: npm ci

      - name: Build server
        working-directory: notework-server
        run: npm run build

      - name: Build Docker images
        run: docker compose build
