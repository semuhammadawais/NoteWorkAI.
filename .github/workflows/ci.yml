name: NoteworkAI CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install client dependencies
        working-directory: notework-client
        run: npm ci

      - name: Build client
        working-directory: notework-client
        run: npm run build

      - name: Install server dependencies
        working-directory: notework-server
        run: npm ci

      - name: Build server
        working-directory: notework-server
        run: npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: ./notework-client
          push: true
          tags: semuhammadawais/notework-client:latest

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./notework-server
          push: true
          tags: semuhammadawais/notework-server:latest
